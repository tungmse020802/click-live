<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      pointer-events: none;
    }
    .wrap {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 6px 10px;
      min-height: 100%;
    }
    .clock {
      font-family: "SF Mono", "Menlo", "Consolas", "Courier New", monospace;
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #f8fafc;
      text-shadow:
        0 0 8px rgba(0, 0, 0, 0.95),
        0 2px 4px rgba(0, 0, 0, 0.85),
        0 0 24px rgba(59, 130, 246, 0.35);
      font-variant-numeric: tabular-nums;
    }
    .clock.idle {
      font-size: 28px;
      color: rgba(248, 250, 252, 0.35);
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
    }
    .clock.urgent {
      color: #fbbf24;
      text-shadow:
        0 0 10px rgba(0, 0, 0, 0.95),
        0 0 20px rgba(251, 191, 36, 0.55);
    }
    .clock.zero {
      color: #34d399;
      text-shadow:
        0 0 10px rgba(0, 0, 0, 0.95),
        0 0 22px rgba(52, 211, 153, 0.55);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="clock" class="clock idle">--</div>
  </div>
  <script>
    const clockEl = document.getElementById('clock');
    let targetAtMs = null;
    let active = false;
    let rafId = null;

    function formatSec(ms) {
      const sec = Math.max(0, ms / 1000);
      return sec.toFixed(2);
    }

    function renderFrame() {
      rafId = null;
      if (!active || !targetAtMs) {
        clockEl.textContent = '--';
        clockEl.className = 'clock idle';
        return;
      }

      const remainingMs = Math.max(0, Math.round(targetAtMs - Date.now()));
      clockEl.textContent = formatSec(remainingMs);

      if (remainingMs <= 0) {
        clockEl.className = 'clock zero';
      } else if (remainingMs <= 3000) {
        clockEl.className = 'clock urgent';
      } else {
        clockEl.className = 'clock';
      }

      rafId = requestAnimationFrame(renderFrame);
    }

    function applyState(payload) {
      active = Boolean(payload?.active);
      targetAtMs = active ? Number(payload.targetAtMs) || null : null;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(renderFrame);
    }

    if (window.countdownOverlay && window.countdownOverlay.onUpdate) {
      window.countdownOverlay.onUpdate(applyState);
    }
  </script>
</body>
</html>
