<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      pointer-events: none;
    }
    .wrap {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 6px 10px;
      min-height: 100%;
    }
    .clock {
      font-family: "SF Mono", "Menlo", "Consolas", "Courier New", monospace;
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #ffffff;
      -webkit-text-stroke: 1px rgba(0, 0, 0, 0.45);
      paint-order: stroke fill;
      text-shadow:
        0 0 12px rgba(0, 0, 0, 1),
        0 3px 8px rgba(0, 0, 0, 0.95),
        0 0 32px rgba(59, 130, 246, 0.45);
      font-variant-numeric: tabular-nums;
    }
    .clock.idle {
      font-size: 40px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.4);
      -webkit-text-stroke: 0;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
    }
    .clock.urgent {
      color: #fcd34d;
      -webkit-text-stroke: 1px rgba(0, 0, 0, 0.5);
      text-shadow:
        0 0 14px rgba(0, 0, 0, 1),
        0 0 28px rgba(251, 191, 36, 0.7);
    }
    .clock.zero {
      color: #4ade80;
      -webkit-text-stroke: 1px rgba(0, 0, 0, 0.5);
      text-shadow:
        0 0 14px rgba(0, 0, 0, 1),
        0 0 30px rgba(74, 222, 128, 0.65);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="clock" class="clock idle">--</div>
  </div>
  <script>
    const clockEl = document.getElementById('clock');
    let targetAtMs = null;
    let active = false;
    let rafId = null;

    function formatSec(ms) {
      const sec = Math.max(0, ms / 1000);
      return sec.toFixed(2);
    }

    function renderFrame() {
      rafId = null;
      if (!active || !targetAtMs) {
        clockEl.textContent = '--';
        clockEl.className = 'clock idle';
        return;
      }

      const remainingMs = Math.max(0, Math.round(targetAtMs - Date.now()));
      clockEl.textContent = formatSec(remainingMs);

      if (remainingMs <= 0) {
        clockEl.className = 'clock zero';
      } else if (remainingMs <= 3000) {
        clockEl.className = 'clock urgent';
      } else {
        clockEl.className = 'clock';
      }

      rafId = requestAnimationFrame(renderFrame);
    }

    function applyState(payload) {
      active = Boolean(payload?.active);
      targetAtMs = active ? Number(payload.targetAtMs) || null : null;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(renderFrame);
    }

    if (window.countdownOverlay && window.countdownOverlay.onUpdate) {
      window.countdownOverlay.onUpdate(applyState);
    }
  </script>
</body>
</html>
