<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Chọn điểm click</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      cursor: crosshair;
      background: rgba(15, 20, 27, 0.35);
      overflow: hidden;
      user-select: none;
    }
    .hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(23, 33, 43, 0.92);
      color: #f5f5f5;
      padding: 12px 18px;
      border-radius: 10px;
      font: 14px/1.4 system-ui, sans-serif;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      pointer-events: none;
    }
    .crosshair {
      position: fixed;
      width: 28px;
      height: 28px;
      border: 2px solid #3b82f6;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <div class="hint">Click vào vị trí trên màn hình desktop · Esc để huỷ</div>
  <div class="crosshair" id="crosshair"></div>
  <script>
    const { ipcRenderer } = require('electron');
    const crosshair = document.getElementById('crosshair');

    document.addEventListener('mousemove', (e) => {
      crosshair.style.display = 'block';
      crosshair.style.left = e.screenX + 'px';
      crosshair.style.top = e.screenY + 'px';
    });

    document.addEventListener('click', (e) => {
      ipcRenderer.send('pick-point-done', { x: e.screenX, y: e.screenY });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ipcRenderer.send('pick-point-cancel');
    });
  </script>
</body>
</html>
