# Copy to Windows PC (same WiFi as phone). Rename to frpc.ini and run frpc.exe
#
# 1) Install Phone Monitor on Android -> note phone IP e.g. 192.168.1.50:8791
# 2) Download frp Windows: https://github.com/fatedier/frp/releases
# 3) Replace TOKEN and PHONE_LAN_IP below
# 4) Run: frpc.exe -c frpc.ini

serverAddr = 160-30-19-215.sslip.io
# Port 443 nếu 7000 bị chặn (nginx stream → frps). Hoặc 7000 bình thường.
serverPort = 443
auth.token = PASTE_FRP_TOKEN_FROM_VPS

[[proxies]]
name = phone_monitor
type = tcp
localIP = 192.168.1.50
localPort = 8791
remotePort = 8791
