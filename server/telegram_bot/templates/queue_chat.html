<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17212b">
  <meta name="click-live-queue-version" content="countdown-href-v2">
  <title>Hàng đợi — Telegram</title>
  <style>
    :root {
      --tg-bg: #0e1621;
      --tg-panel: #17212b;
      --tg-header: #17212b;
      --tg-bubble: #182533;
      --tg-bubble-hover: #1f2c3a;
      --tg-text: #f5f5f5;
      --tg-muted: #708499;
      --tg-link: #6ab2f2;
      --tg-accent: #5288c1;
      --tg-green: #4fae4e;
      --tg-amber: #e5a045;
      --tg-red: #e15b5b;
      --tg-border: #242f3d;
      --tg-input: #242f3d;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--tg-bg);
      color: var(--tg-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }

    .shell {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: var(--tg-header);
      border-bottom: 1px solid var(--tg-border);
      flex-wrap: wrap;
    }

    .brand { min-width: 0; flex: 1 1 auto; }
    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.2;
    }
    .brand .sub {
      margin-top: 2px;
      color: var(--tg-muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      width: 100%;
    }

    .control {
      height: 36px;
      border: 0;
      background: var(--tg-input);
      color: var(--tg-text);
      border-radius: 8px;
      padding: 0 10px;
      min-width: 0;
      flex: 1 1 100px;
    }

    .button {
      height: 36px;
      min-width: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: var(--tg-input);
      color: var(--tg-text);
      border-radius: 8px;
      padding: 0 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .button:hover { background: #2f3b4a; }
    .button.primary { background: var(--tg-accent); color: #fff; }
    .button.primary:hover { background: #5a94c9; }
    .button.open-link {
      background: var(--tg-green);
      color: #fff;
      font-weight: 600;
      min-height: 40px;
      flex: 1 1 auto;
    }
    .button.open-link:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .checkbox {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--tg-muted);
      font-size: 13px;
      height: 36px;
    }

    .stats-bar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      overflow-x: auto;
      background: var(--tg-panel);
      border-bottom: 1px solid var(--tg-border);
      scrollbar-width: none;
    }
    .stats-bar::-webkit-scrollbar { display: none; }

    .stat-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--tg-input);
      font-size: 12px;
      color: var(--tg-muted);
    }
    .stat-pill strong { color: var(--tg-text); font-size: 13px; }

    .desktop-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--tg-red);
      flex-shrink: 0;
    }
    .desktop-dot.online { background: var(--tg-green); }

    .chat-shell {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chat-feed {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 12px calc(12px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-empty {
      margin: auto;
      text-align: center;
      color: var(--tg-muted);
      padding: 24px;
    }

    .chat-message {
      background: var(--tg-bubble);
      border-radius: 12px 12px 12px 4px;
      padding: 10px 12px 12px;
      border: 1px solid var(--tg-border);
      max-width: 100%;
    }
    .chat-message.selected {
      outline: 2px solid var(--tg-accent);
      background: var(--tg-bubble-hover);
    }
    .chat-message.pending { border-left: 3px solid var(--tg-amber); }
    .chat-message.processing { border-left: 3px solid var(--tg-accent); }
    .chat-message.done { border-left: 3px solid var(--tg-green); opacity: 0.92; }
    .chat-message.dead, .chat-message.failed { border-left: 3px solid var(--tg-red); opacity: 0.75; }
    .superseded-note { margin-top: 6px; font-size: 11px; color: var(--tg-amber); }

    .chat-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-bottom: 8px;
    }
    .chat-room {
      font-weight: 600;
      font-size: 13px;
      color: var(--tg-link);
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-meta {
      font-size: 11px;
      color: var(--tg-muted);
      white-space: nowrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .badge.pending { background: rgba(229,160,69,.2); color: #f0c070; }
    .badge.processing { background: rgba(82,136,193,.25); color: #8ec0ff; }
    .badge.done { background: rgba(79,174,78,.2); color: #8ddf8c; }
    .badge.dead, .badge.failed { background: rgba(225,91,91,.2); color: #ff9e9e; }

    .chat-body {
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
    }
    .chat-body a {
      color: var(--tg-link);
      text-decoration: none;
    }
    .chat-body a:hover { text-decoration: underline; }
    .chat-body strong, .chat-body b { font-weight: 700; }
    .chat-body em, .chat-body i { font-style: italic; }
    .chat-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(0,0,0,.25);
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 0.92em;
    }

    .chat-time-row {
      margin-top: 6px;
      font-size: 12px;
      color: var(--tg-muted);
    }

    .chat-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--tg-border);
    }

    .chat-actions .button.secondary {
      background: transparent;
      border: 1px solid var(--tg-border);
      min-height: 38px;
    }

    .live-status {
      width: 100%;
      font-size: 12px;
      color: var(--tg-muted);
      padding: 4px 0 0;
      min-height: 18px;
    }

    .jump-newest {
      position: absolute;
      left: 50%;
      bottom: calc(16px + var(--safe-bottom));
      transform: translateX(-50%);
      z-index: 5;
      display: none;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(106, 178, 242, 0.45);
      border-radius: 999px;
      background: rgba(23, 33, 43, 0.96);
      color: var(--tg-text);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .jump-newest.visible { display: inline-flex; }
    .jump-newest.at-top {
      top: 12px;
      bottom: auto;
    }
    .jump-newest .arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--tg-accent);
      color: #fff;
      font-size: 14px;
      line-height: 1;
    }
    .jump-newest .count {
      min-width: 1.2em;
      color: var(--tg-link);
    }

    @media (min-width: 900px) {
      .toolbar { width: auto; flex: 0 0 auto; }
      .chat-feed {
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>Nhóm theo dõi</h1>
        <div class="sub" id="dbPath">Đang tải...</div>
      </div>
      <div class="toolbar">
        <select id="statusFilter" class="control" aria-label="Trạng thái">
          <option value="" selected>Tất cả (30 phút)</option>
          <option value="pending">Chờ xử lý</option>
          <option value="processing">Đang xử lý</option>
          <option value="done">Hoàn thành</option>
          <option value="dead,failed">Lỗi</option>
        </select>
        <select id="limitFilter" class="control" aria-label="Số tin">
          <option value="25">25 tin</option>
          <option value="50" selected>50 tin</option>
          <option value="100">100 tin</option>
        </select>
        <label class="checkbox"><input id="autoRefresh" type="checkbox" checked> Live</label>
        <button id="reloadBtn" class="button" title="Tải lại">↻</button>
        <button id="filtersBtn" class="button">Lọc</button>
        <button id="watchBtn" class="button">Theo dõi</button>
        <button id="phoneBtn" class="button">Điện thoại</button>
        <button id="nextPhoneBtn" class="button primary">Tin mới nhất</button>
        <button id="logoutBtn" class="button">Thoát</button>
      </div>
      <div class="live-status" id="liveStatus">Đang khởi động...</div>
    </header>

    <div class="stats-bar" id="stats"></div>

    <main class="chat-shell">
      <div class="chat-feed" id="chatFeed">
        <div class="chat-empty" id="emptyState">Chưa có tin nhắn</div>
      </div>
      <button type="button" id="jumpNewestBtn" class="jump-newest" title="Thêm tin mới vào danh sách">
        <span class="arrow" aria-hidden="true">↑</span>
        <span><span id="jumpNewestCount" class="count">0</span> tin mới</span>
      </button>
    </main>
  </div>

  <script>
    const TAB_TTL_SECONDS = 30;

    const MIN_REFRESH_SECONDS = 3;

    const state = {
      items: [],
      selectedId: null,
      timer: null,
      refreshSeconds: MIN_REFRESH_SECONDS,
      queueTtlSeconds: 1800,
      controller: null,
      inFlight: false,
      pendingReload: false,
      desktopOnline: false,
      displayTopId: 0,
      lastRenderedLatestId: 0,
      newArrivalCount: 0,
      scrollPinThreshold: 48,
      wasPinnedToTop: true
    };

    const els = {
      dbPath: document.getElementById('dbPath'),
      stats: document.getElementById('stats'),
      feed: document.getElementById('chatFeed'),
      empty: document.getElementById('emptyState'),
      status: document.getElementById('statusFilter'),
      limit: document.getElementById('limitFilter'),
      auto: document.getElementById('autoRefresh'),
      reload: document.getElementById('reloadBtn'),
      liveStatus: document.getElementById('liveStatus'),
      jumpNewestBtn: document.getElementById('jumpNewestBtn'),
      jumpNewestCount: document.getElementById('jumpNewestCount')
    };

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function timeShort(value) {
      if (!value) return '';
      const d = new Date(value * 1000);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function timeFull(value) {
      if (!value) return '';
      return new Date(value * 1000).toLocaleString();
    }

    function badge(status) {
      return `<span class="badge ${esc(status)}">${esc(status)}</span>`;
    }

    function roomLabel(item) {
      const room = item.room || {};
      return room.title || room.chat_id || 'Nhóm';
    }

    function decodeHtmlUrl(url) {
      return String(url || '')
        .replace(/&amp;/gi, '&')
        .replace(/&lt;/gi, '<')
        .replace(/&gt;/gi, '>')
        .replace(/&quot;/gi, '"')
        .trim();
    }

    function isCountdownHref(href) {
      return /junb\.io\.vn\/box-countdown|thanhtai\.io\/countdow/i.test(href || '');
    }

    function countdownUrlFromDisplayHtml(html) {
      const text = String(html || '').trim();
      if (!text) return '';
      try {
        const doc = new DOMParser().parseFromString(text, 'text/html');
        for (const a of doc.querySelectorAll('a[href]')) {
          const inner = (a.textContent || '').replace(/\s+/g, ' ').trim();
          if (!/\d+\s*\/\s*\d+/.test(inner)) continue;
          const href = decodeHtmlUrl(a.getAttribute('href') || '');
          if (isCountdownHref(href)) return href;
        }
      } catch (_) {
        /* ignore parse errors */
      }
      return '';
    }

    function countdownUrlFromCard(jobId) {
      const card = els.feed.querySelector(`.chat-message[data-id="${CSS.escape(String(jobId))}"]`);
      if (!card) return '';
      for (const a of card.querySelectorAll('.chat-body a[href]')) {
        const inner = (a.textContent || '').replace(/\s+/g, ' ').trim();
        if (!/\d+\s*\/\s*\d+/.test(inner)) continue;
        const href = decodeHtmlUrl(a.getAttribute('href') || '');
        if (isCountdownHref(href)) return href;
      }
      return '';
    }

    function countdownUrlFromItem(item) {
      const fromCard = item?.id ? countdownUrlFromCard(item.id) : '';
      if (fromCard) return fromCard;
      const fromDisplay = countdownUrlFromDisplayHtml(item?.display_html);
      if (fromDisplay) return fromDisplay;
      const fromTelegram = countdownUrlFromDisplayHtml(item?.payload?.telegram_html);
      if (fromTelegram) return fromTelegram;
      if (item?.countdown_url) return decodeHtmlUrl(item.countdown_url);
      return findLink(item);
    }

    function findLink(item) {
      const payload = item?.payload || {};
      const message = item?.message || {};
      const html = String(payload.telegram_html || '');
      const combined = [html, message.text, payload.source_url, payload.url, payload.link].filter(Boolean).join('\n');
      const boxMatch = combined.match(/https?:\/\/[^\s<>'"]*junb\.io\.vn\/box-countdown\/[^\s<>'"]+/i);
      if (boxMatch) return decodeHtmlUrl(boxMatch[0]);
      const ttMatch = combined.match(/https?:\/\/[^\s<>'"]*thanhtai\.io\/countdow[^\s<>'"]*/i);
      if (ttMatch) return decodeHtmlUrl(ttMatch[0]);
      const candidates = [
        payload.source_url, payload.url, payload.link,
        payload.deeplink, payload.live_url, message.text
      ];
      for (const value of candidates) {
        const text = String(value || '');
        const match = text.match(/(?:https?:\/\/|snssdk1180:\/\/)[^\s<>'\"]+/i);
        if (match) return match[0];
      }
      return '';
    }

    function itemContext(item) {
      const payload = item?.payload || {};
      const parts = [];
      const messageText = String(item?.message?.text || '').trim();
      if (messageText) parts.push(messageText);
      const telegramHtml = String(payload.telegram_html || '').trim();
      if (telegramHtml) parts.push(telegramHtml);
      for (const key of ['url', 'link', 'live_url', 'room_url', 'source_url']) {
        const value = String(payload[key] || '').trim();
        if (value) parts.push(value);
      }
      return parts.join('\n');
    }

    async function resolveQueueLink(item) {
      const direct = countdownUrlFromItem(item);
      if (direct && !/\/open\/live|snssdk1180:\/\//i.test(direct)) {
        return {
          ok: true,
          countdown_url: direct,
          open_url: direct,
          room_id: item.room_id || '',
          deeplink: item.deeplink || ''
        };
      }
      const link = findLink(item);
      if (!link) throw new Error('Không phát hiện link');
      const res = await fetch('/api/deeplink/resolve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: link, context: itemContext(item) })
      });
      const data = await res.json();
      if (res.status === 401) {
        location.href = '/login?next=' + encodeURIComponent(location.pathname);
        return null;
      }
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      if (!data.countdown_url || /\/open\/live|snssdk1180:\/\//i.test(data.countdown_url)) {
        throw new Error('Không resolve được countdown URL');
      }
      return data;
    }

    async function openViaDesktopRelay(url, jobId, extra = {}) {
      const res = await fetch('/api/desktop/open', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url,
          ttl_seconds: TAB_TTL_SECONDS,
          job_id: jobId,
          click_after_ms: Number(extra.click_after_ms) || 0,
          time_label: String(extra.time_label || '')
        })
      });
      const data = await res.json();
      if (res.status === 401) {
        location.href = '/login?next=' + encodeURIComponent(location.pathname);
        return null;
      }
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function openPhoneViaMonitor(phoneUrl, item, timeMeta) {
      const base = (localStorage.getItem('phoneMonitorBaseUrl') || '').replace(/\/$/, '');
      if (!base) return null;
      const point = phoneClickPoint();
      const body = new URLSearchParams({
        url: phoneUrl,
        source: 'queue',
        queue_id: String(item.id),
        time: timeMeta.label || '',
        click_after_ms: String(timeMeta.click_after_ms || 0),
        click_x: String(point.x),
        click_y: String(point.y)
      });
      const res = await fetch(base + '/actions/deeplink', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });
      if (!res.ok) throw new Error(await res.text() || `HTTP ${res.status}`);
      return { ok: true, method: 'phone_monitor_client' };
    }

    async function openCountdownForItem(item) {
      if (!item) return;
      els.liveStatus.textContent = `Đang mở link job #${item.id}...`;
      const link = findLink(item);
      if (!link) throw new Error('Không phát hiện link');
      const timeMeta = findTimeMeta(item);
      const point = phoneClickPoint();

      const res = await fetch('/api/open/link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url: link,
          context: itemContext(item),
          job_id: item.id,
          ttl_seconds: TAB_TTL_SECONDS,
          click_after_ms: timeMeta.click_after_ms,
          time_label: timeMeta.label,
          click_x: point.x,
          click_y: point.y,
          open_phone: true,
          open_desktop: true
        })
      });
      const data = await res.json();
      if (res.status === 401) {
        location.href = '/login?next=' + encodeURIComponent(location.pathname);
        return;
      }
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);

      const target = decodeHtmlUrl(data.countdown_url || '');
      if (!target || /\/open\/live|snssdk1180:\/\//i.test(target)) {
        throw new Error('Không có URL countdown hợp lệ');
      }

      let phoneNote = '';
      if (data.phone?.ok) {
        phoneNote = ' · điện thoại ✓';
      } else if (data.phone_open_url) {
        try {
          const localPhone = await openPhoneViaMonitor(data.phone_open_url, item, timeMeta);
          if (localPhone?.ok) phoneNote = ' · điện thoại ✓ (local)';
        } catch (err) {
          phoneNote = ` · phone: ${err.message}`;
        }
      }

      const desktop = data.desktop || {};
      if (desktop.deduplicated) {
        els.liveStatus.textContent = `Link đã mở trên desktop (dedup) · job #${item.id}${phoneNote}`;
      } else if (state.desktopOnline) {
        els.liveStatus.textContent = `Desktop + deeplink · job #${item.id}${phoneNote}`;
      } else {
        els.liveStatus.textContent = `Đã xếp hàng desktop · job #${item.id}${phoneNote}`;
      }
    }

    async function checkDesktopTool() {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 2500);
        const res = await fetch('/api/desktop/status', { cache: 'no-store', signal: ctrl.signal });
        clearTimeout(timer);
        const data = await res.json();
        state.desktopOnline = Boolean(data.ok && data.desktop_online);
      } catch {
        state.desktopOnline = false;
      }
    }

    function parseTimeDelayMs(value) {
      const text = String(value || '').trim();
      if (!text) return 0;
      let match = text.match(/(\d{1,2}):(\d{2})\s*s?/i);
      if (match) return (Number(match[1]) * 60 + Number(match[2])) * 1000;
      match = text.match(/(\d+(?:\.\d+)?)\s*s/i);
      if (match) return Math.round(Number(match[1]) * 1000);
      return 0;
    }

    function findTimeMeta(item) {
      const payload = item?.payload || {};
      const message = item?.message || {};
      const candidates = [payload.TIME, payload.time, payload.Time, message.text];
      for (const value of candidates) {
        const text = String(value || '');
        const match = text.match(/TIME\s*[:：]\s*([^\n\r]+)/i)
          || text.match(/(\d{1,2}:\d{2}\s*s?\s*-\s*\d{1,2}:\d{2}:\d{2})/i)
          || text.match(/(\d{1,2}:\d{2}\s*s?)/i);
        if (match) {
          const label = match[1].trim();
          return { label, click_after_ms: parseTimeDelayMs(label) };
        }
      }
      return { label: '', click_after_ms: 0 };
    }

    function phoneClickPoint() {
      return {
        x: Number(localStorage.getItem('phoneClickX') || 540),
        y: Number(localStorage.getItem('phoneClickY') || 1800)
      };
    }

    async function sendToPhone(item) {
      const link = findLink(item);
      if (!link) throw new Error('Không có link');
      const base = (localStorage.getItem('phoneMonitorBaseUrl') || '').replace(/\/$/, '');
      if (!base) {
        localStorage.setItem('pendingQueueLink', link);
        localStorage.setItem('pendingQueueJobId', String(item.id));
        const timeMeta = findTimeMeta(item);
        localStorage.setItem('pendingQueueTime', timeMeta.label);
        localStorage.setItem('pendingQueueClickAfterMs', String(timeMeta.click_after_ms));
        window.location.href = '/phone-monitor';
        return;
      }
      const point = phoneClickPoint();
      const timeMeta = findTimeMeta(item);
      const body = new URLSearchParams({
        url: link, source: 'queue', queue_id: String(item.id),
        time: timeMeta.label, click_after_ms: String(timeMeta.click_after_ms),
        click_x: String(point.x), click_y: String(point.y)
      });
      const res = await fetch(base + '/actions/deeplink', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });
      if (!res.ok) throw new Error(await res.text() || `HTTP ${res.status}`);
    }

    async function sendNewestToPhone() {
      const pending = state.items.filter((i) => i.status === 'pending')
        .sort((a, b) => Number(b.id) - Number(a.id));
      const item = pending[0];
      if (!item) {
        els.liveStatus.textContent = 'Không có tin chờ';
        return;
      }
      await sendToPhone(item);
      els.liveStatus.textContent = `Đã gửi tin #${item.id} sang điện thoại`;
    }

    function renderStats(stats, data) {
      const labels = {
        pending: 'Chờ', processing: 'Xử lý', done: 'Xong',
        dead: 'Chết', failed: 'Lỗi', total: 'Tổng'
      };
      const total = Object.values(stats).reduce((s, v) => s + Number(v || 0), 0);
      const latest = data.latest_id || 0;
      const desktopClass = state.desktopOnline ? 'online' : '';
      els.stats.innerHTML = `
        <span class="stat-pill"><span class="desktop-dot ${desktopClass}"></span> Desktop</span>
        <span class="stat-pill">Mới <strong>#${latest}</strong></span>
        <span class="stat-pill">Tổng <strong>${total}</strong></span>
        ${['pending','processing','done'].map((k) =>
          `<span class="stat-pill">${labels[k]} <strong>${Number(stats[k] || 0)}</strong></span>`
        ).join('')}
        <span class="stat-pill">${effectiveRefreshSeconds()}s</span>
      `;
    }

    function renderLiveStatus(data) {
      const t = data.generated_at ? new Date(data.generated_at).toLocaleTimeString() : '';
      const dot = state.desktopOnline ? 'Desktop ✓' : 'Desktop ✗';
      const ttlMin = Math.round((state.queueTtlSeconds || 1800) / 60);
      const shown = getDisplayItems().length;
      const buffered = state.newArrivalCount > 0 ? ` · +${state.newArrivalCount} tin mới (bấm ↑)` : '';
      els.liveStatus.textContent = `${dot} · ${t} · ${shown} tin${buffered} · giữ ${ttlMin} phút · Mở link → desktop + deeplink điện thoại`;
    }

    function sortedItems(items = state.items) {
      return [...items].sort((a, b) => Number(b.id) - Number(a.id));
    }

    function latestItemId(items = state.items) {
      const sorted = sortedItems(items);
      return sorted[0]?.id || 0;
    }

    /** Tin mới luôn buffer — chỉ thêm card khi user bấm ↑ */
    function getDisplayItems() {
      const sorted = sortedItems();
      if (!sorted.length || state.displayTopId === 0) {
        return sorted;
      }
      return sorted.filter((item) => Number(item.id) <= Number(state.displayTopId));
    }

    function syncDisplayWindow() {
      const sorted = sortedItems();
      if (state.displayTopId === 0) {
        state.displayTopId = latestItemId();
        state.newArrivalCount = 0;
      } else if (sorted.length) {
        const stillVisible = sorted.some(
          (item) => Number(item.id) <= Number(state.displayTopId)
        );
        if (!stillVisible) {
          state.displayTopId = latestItemId();
          state.newArrivalCount = 0;
        } else {
          state.newArrivalCount = sorted.filter(
            (item) => Number(item.id) > Number(state.displayTopId)
          ).length;
        }
      } else {
        state.newArrivalCount = 0;
      }
      updateJumpNewestButton();
    }

    function releaseBufferedItems() {
      state.displayTopId = latestItemId();
      state.newArrivalCount = 0;
      updateJumpNewestButton();
      renderChat();
    }

    function isPinnedToTop() {
      return els.feed.scrollTop <= state.scrollPinThreshold;
    }

    function updateJumpNewestButton() {
      const show = state.newArrivalCount > 0;
      els.jumpNewestBtn.classList.toggle('visible', show);
      els.jumpNewestBtn.classList.toggle('at-top', show && isPinnedToTop());
      els.jumpNewestCount.textContent = String(state.newArrivalCount);
    }

    function jumpToNewest() {
      releaseBufferedItems();
      els.feed.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function restoreScrollAfterRender(prevScrollTop, firstPaint) {
      els.feed.scrollTop = firstPaint ? 0 : prevScrollTop;
    }

    function renderChat() {
      const sorted = getDisplayItems();
      const latestId = sorted[0]?.id || 0;
      const hadItemsBefore = state.lastRenderedLatestId > 0;
      const firstPaint = !hadItemsBefore;
      const prevScrollTop = els.feed.scrollTop;

      els.empty.hidden = sorted.length > 0;

      if (!sorted.length) {
        if (state.items.length) {
          syncDisplayWindow();
          const retry = getDisplayItems();
          if (retry.length) {
            renderChat();
            return;
          }
        }
        els.feed.innerHTML = '';
        els.feed.appendChild(els.empty);
        state.lastRenderedLatestId = 0;
        updateJumpNewestButton();
        return;
      }

      els.feed.innerHTML = sorted.map((item) => {
        const selected = item.id === state.selectedId ? 'selected' : '';
        const timeMeta = findTimeMeta(item);
        const bodyHtml = item.display_html || esc(item.message?.text || '');
        const hasLink = item.has_link || item.countdown_url || findLink(item);
        const superseded = String(item.last_error || '').includes('superseded');
        const canOpen = hasLink && item.status !== 'dead' && item.status !== 'failed';
        return `
          <article class="chat-message ${esc(item.status)} ${selected}" data-id="${item.id}">
            <div class="chat-head">
              <span class="chat-room">${esc(roomLabel(item))}</span>
              ${badge(item.status)}
              <span class="chat-meta">#${item.id}</span>
            </div>
            <div class="chat-body tg-format">${bodyHtml}</div>
            ${timeMeta.label ? `<div class="chat-time-row">⏱ ${esc(timeMeta.label)}</div>` : ''}
            <div class="chat-time-row">${esc(timeFull(item.created_at))}</div>
            ${superseded ? `<div class="superseded-note">Đã thay bằng tin mới — vẫn giữ 30 phút trên queue</div>` : ''}
            <div class="chat-actions">
              <button type="button" class="button open-link" data-open-link="${item.id}" ${canOpen ? '' : 'disabled'}>Mở link</button>
              <button type="button" class="button secondary" data-phone="${item.id}" ${item.status === 'pending' ? '' : 'disabled'}>Điện thoại</button>
            </div>
          </article>
        `;
      }).join('');

      els.feed.querySelectorAll('.chat-message').forEach((node) => {
        node.addEventListener('click', (e) => {
          if (e.target.closest('button, a')) return;
          state.selectedId = Number(node.dataset.id);
          renderChat();
        });
      });

      els.feed.querySelectorAll('[data-open-link]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const item = state.items.find((v) => v.id === Number(btn.dataset.openLink));
          openCountdownForItem(item).catch((err) => {
            els.liveStatus.textContent = `Lỗi: ${err.message}`;
          });
        });
      });

      els.feed.querySelectorAll('[data-phone]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const item = state.items.find((v) => v.id === Number(btn.dataset.phone));
          sendToPhone(item).catch((err) => {
            els.liveStatus.textContent = `Lỗi điện thoại: ${err.message}`;
          });
        });
      });

      restoreScrollAfterRender(prevScrollTop, firstPaint);
      state.lastRenderedLatestId = latestId;
    }

    function effectiveRefreshSeconds() {
      return Math.max(MIN_REFRESH_SECONDS, Number(state.refreshSeconds) || MIN_REFRESH_SECONDS);
    }

    async function loadQueue({ force = false } = {}) {
      if (state.inFlight) {
        if (force) state.pendingReload = true;
        return;
      }
      state.inFlight = true;
      state.controller = new AbortController();

      try {
        const params = new URLSearchParams();
        params.set('limit', els.limit.value);
        params.set('_', String(Date.now()));
        if (els.status.value) params.set('statuses', els.status.value);

        const [_, res] = await Promise.all([
          checkDesktopTool(),
          fetch('/api/queue?' + params.toString(), {
            cache: 'no-store',
            signal: state.controller.signal
          })
        ]);

        if (res.status === 401) {
          location.href = '/login?next=' + encodeURIComponent(location.pathname);
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        state.items = data.items || [];
        state.refreshSeconds = data.refresh_seconds || MIN_REFRESH_SECONDS;
        els.dbPath.textContent = data.db_path || '';
        state.queueTtlSeconds = data.queue_ttl_seconds || 1800;
        syncDisplayWindow();
        renderStats(data.stats || {}, data);
        renderChat();
        renderLiveStatus(data);
        checkDesktopTool().then(() => {
          renderStats(data.stats || {}, data);
          renderLiveStatus(data);
        });
      } finally {
        state.inFlight = false;
        if (state.pendingReload) {
          state.pendingReload = false;
          loadQueue({ force: true }).catch((err) => {
            if (err.name !== 'AbortError') els.liveStatus.textContent = `Lỗi: ${err.message}`;
          });
        }
      }
    }

    function schedule() {
      clearInterval(state.timer);
      if (els.auto.checked) {
        const tick = () => {
          loadQueue({ force: true }).catch((err) => {
            if (err.name !== 'AbortError') els.liveStatus.textContent = `Lỗi: ${err.message}`;
          });
        };
        state.timer = setInterval(tick, effectiveRefreshSeconds() * 1000);
      }
    }

    els.reload.addEventListener('click', () => loadQueue().catch((err) => {
      if (err.name !== 'AbortError') els.liveStatus.textContent = `Lỗi: ${err.message}`;
    }));
    document.getElementById('filtersBtn').addEventListener('click', () => { location.href = '/filters'; });
    document.getElementById('watchBtn').addEventListener('click', () => { location.href = '/watch'; });
    document.getElementById('phoneBtn').addEventListener('click', () => { location.href = '/phone-monitor'; });
    document.getElementById('nextPhoneBtn').addEventListener('click', () => {
      sendNewestToPhone().catch((err) => { els.liveStatus.textContent = `Lỗi: ${err.message}`; });
    });
    els.auto.addEventListener('change', schedule);
    els.status.addEventListener('change', () => {
      state.displayTopId = 0;
      state.lastRenderedLatestId = 0;
      state.newArrivalCount = 0;
      if (state.controller) state.controller.abort();
      loadQueue({ force: true });
    });
    els.limit.addEventListener('change', () => {
      state.displayTopId = 0;
      state.lastRenderedLatestId = 0;
      state.newArrivalCount = 0;
      if (state.controller) state.controller.abort();
      loadQueue({ force: true });
    });
    els.jumpNewestBtn.addEventListener('click', jumpToNewest);
    els.feed.addEventListener('scroll', () => {
      const pinned = isPinnedToTop();
      if (state.wasPinnedToTop && !pinned && state.lastRenderedLatestId > 0) {
        state.displayTopId = state.lastRenderedLatestId;
        syncDisplayWindow();
      }
      updateJumpNewestButton();
      state.wasPinnedToTop = pinned;
    }, { passive: true });

    loadQueue().then(schedule).catch((err) => {
      els.liveStatus.textContent = err.message;
    });
  </script>

  </script>
